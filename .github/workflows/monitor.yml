name: 东横Inn 监控 (v25.0 多频次控制版)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  check_rooms:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v3

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安装依赖
        run: pip install requests beautifulsoup4 resend

      - name: 生成并运行脚本
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
        run: |
          cat << 'EOF' > monitor.py
          import requests
          from bs4 import BeautifulSoup
          import os
          import resend
          import time
          from urllib.parse import urlparse, parse_qs, unquote
          import json
          import re
          from datetime import datetime, timedelta, timezone

          # === 1. 时间控制器 ===
          tz_beijing = timezone(timedelta(hours=8))
          now = datetime.now(tz_beijing)

          try:
              if os.path.exists('run_time.txt'):
                  with open('run_time.txt', 'r') as f:
                      content = f.read().strip()
                      if '-' in content:
                          s, e = map(int, content.split('-'))
                          h = now.hour
                          is_run = (s <= h <= e) if s <= e else (h >= s or h <= e)
                          if not is_run:
                              print(f'💤 休眠时间 ({s}-{e})，当前 {h} 点。')
                              exit(0)
          except: pass

          # === 2. 基础配置与多频次过滤 ===
          resend.api_key = os.environ.get('RESEND_API_KEY')
          user_email = os.environ.get('USER_EMAIL', '').strip()
          
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www.toyoko-inn.com/china_cn/',
              'Connection': 'keep-alive',
          }

          # 判断 30 分钟轮询窗口：00~14分、30~44分区间执行；15~29分、45~59分区间跳过
          is_30m_slot = (now.minute % 30) < 15

          urls = []
          skipped_count = 0
          try:
              with open('urls.txt', 'r', encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith('#'):
                          continue
                      
                      freq = 15
                      url_str = line
                      if '|' in line:
                          parts = line.split('|', 1)
                          url_str = parts[0].strip()
                          try:
                              freq = int(parts[1].strip())
                          except:
                              freq = 15
                      
                      # 如果是 30 分钟频次，且当前不在 30 分钟时间槽，则自动跳过
                      if freq == 30 and not is_30m_slot:
                          skipped_count += 1
                          continue
                      
                      urls.append(url_str)
          except Exception as e:
              print(f'❌ 找不到或无法读取 urls.txt: {e}')
              exit(1)

          print(f'\n📋 启动监控: 本次扫描 {len(urls)} 个任务 (已自动跳过 {skipped_count} 个 30分频 任务) [v25.0]\n')
          
          session = requests.Session()
          session.headers.update(headers)
          
          # 预热
          try: session.get('https://www.toyoko-inn.com/china_cn/', timeout=5)
          except: pass

          found_list = []

          for i, url in enumerate(urls):
              try:
                  parsed = urlparse(url)
                  params = parse_qs(parsed.query)
                  hotel_id = params.get('hotel', ['未知'])[0]
                  checkin_date = params.get('start', ['未知'])[0]
                  
                  max_price = 999999
                  if 'max' in params:
                      try: max_price = int(params['max'][0])
                      except: pass
                  
                  target_room = None
                  if 'roomtype' in params: target_room = unquote(params['roomtype'][0])
                  
                  target_smoke = None 
                  if 'smoke' in params:
                      val = params['smoke'][0]
                      if val == '1': target_smoke = True
                      elif val == '0': target_smoke = False
              except:
                  hotel_id, checkin_date = '未知', '未知'
                  max_price = 999999
                  target_room, target_smoke = None, None

              print(f'[{i+1}/{len(urls)}] 🏨 {hotel_id} | 📅 {checkin_date}')

              detailed_rooms = [] 
              text_prices = []
              final_hotel_name = f"酒店{hotel_id}"

              try:
                  resp = session.get(url, timeout=30)
                  soup = BeautifulSoup(resp.text, 'html.parser')
                  
                  # === 🔥 优先抓取酒店名字 ===
                  try:
                      h1 = soup.find('h1')
                      if h1:
                          raw_name = h1.get_text(strip=True)
                          final_hotel_name = raw_name.replace('选择套餐', '').replace('东横INN', '').strip()
                          final_hotel_name = f"东横INN {final_hotel_name}"
                  except: pass

                  # === 引擎 A: JSON 解析 (生成表格) ===
                  json_success = False
                  if '__NEXT_DATA__' in resp.text:
                      try:
                          script = soup.find('script', id='__NEXT_DATA__')
                          data = json.loads(script.string)
                          room_plan_list = data.get('props', {}).get('pageProps', {}).get('roomPlanList', [])
                          if room_plan_list is None: room_plan_list = []
                          
                          try:
                              hn = data.get('props', {}).get('pageProps', {}).get('hotel', {}).get('hotelName', '')
                              if hn: final_hotel_name = hn
                          except: pass

                          for plan in room_plan_list:
                              room_types = plan.get('roomTypes', [])
                              for room in room_types:
                                  r_name = room.get('roomTypeName', '')
                                  specs = room.get('specs', {})
                                  is_smoking = specs.get('isSmoking', False)
                                  
                                  vacant = room.get('vacant', {})
                                  stock = vacant.get('generalVacantRoom', 0)
                                  if stock is None: stock = 0
                                  
                                  price_obj = room.get('price', {})
                                  price = price_obj.get('generalPrice', 999999)
                                  
                                  # 筛选逻辑
                                  if stock <= 0: continue
                                  if price > max_price: continue
                                  if target_room and target_room not in r_name: continue
                                  if target_smoke is not None and target_smoke != is_smoking: continue
                                  
                                  smoke_str = '吸烟' if is_smoking else '禁烟'
                                  detailed_rooms.append({
                                      'name': r_name,
                                      'smoke': smoke_str,
                                      'price': price,
                                      'stock': stock
                                  })
                          json_success = True
                      except Exception as e:
                          print(f'      ⚠️ JSON 解析微小错误: {e}')

                  # === 引擎 B: 文本扫描 (兜底) ===
                  if not detailed_rooms:
                      for t in soup(['script', 'style', 'header', 'footer']): t.decompose()
                      clean_text = soup.get_text()
                      
                      raw_prices = re.findall(r'¥\s*([0-9,]+)', clean_text)
                      for p in raw_prices:
                          try:
                              v = int(p.replace(',', ''))
                              if v > 4000 and v != 10000 and v <= max_price: 
                                  text_prices.append(v)
                          except: pass
                      text_prices = sorted(list(set(text_prices)))

                  # === 决策时刻 ===
                  final_item = None
                  
                  if detailed_rooms:
                      best = min(detailed_rooms, key=lambda x: x['price'])
                      print(f'      🎉 列表模式: 发现 {len(detailed_rooms)} 个房型! 最低: {best["name"]} ¥{best["price"]}')
                      final_item = {
                          'name': final_hotel_name,
                          'date': checkin_date,
                          'url': url,
                          'price': best['price'],
                          'details': detailed_rooms,
                          'type': 'json'
                      }
                      
                  elif text_prices:
                      min_p = min(text_prices)
                      print(f'      🎉 文本模式: 发现价格 {text_prices}')
                      final_item = {
                          'name': final_hotel_name,
                          'date': checkin_date,
                          'url': url,
                          'price': min_p,
                          'details': [],
                          'text_prices': text_prices,
                          'type': 'text'
                      }
                  else:
                      print('      😴 暂无符合条件的空房')

                  if final_item:
                      found_list.append(final_item)
                  
                  time.sleep(2)

              except Exception as e:
                  print(f'      ❌ 出错: {e}')

              print('-'*40)

          # === 发送邮件 ===
          if found_list:
              print(f'\n📧 发送邮件 ({len(found_list)}个目标)...')
              if user_email and resend.api_key:
                  try:
                      first = found_list[0]
                      subj = f"【有房】{first['name']} {first['date']} ¥{first['price']}"
                      
                      body = "<h3>🎉 发现空房清单：</h3>"
                      
                      for item in found_list:
                          body += f"<hr>"
                          body += f"<h4>🏨 {item['name']} ({item['date']})</h4>"
                          body += f"<p><a href='{item['url']}'>👉 点击立即预订</a></p>"
                          
                          if item['type'] == 'json' and item['details']:
                              body += "<table border='1' cellpadding='5' style='border-collapse:collapse; width:100%;'>"
                              body += "<tr style='background:#f0f0f0'><th>房型</th><th>吸烟</th><th>价格</th><th>库存</th></tr>"
                              
                              seen = set()
                              for d in item['details']:
                                  key = f"{d['name']}-{d['smoke']}-{d['price']}"
                                  if key not in seen:
                                      seen.add(key)
                                      body += f"<tr><td>{d['name']}</td><td>{d['smoke']}</td><td style='color:red;font-weight:bold;'>¥{d['price']}</td><td>剩{d['stock']}间</td></tr>"
                              body += "</table>"
                          
                          elif item['type'] == 'text' and 'text_prices' in item:
                              body += "<p><strong>⚠️ 未能读取详细房型 (可能需登录)，但检测到以下价格：</strong></p>"
                              body += "<ul>"
                              for p in item['text_prices']:
                                   body += f"<li><span style='color:red;font-weight:bold;'>¥{p}</span></li>"
                              body += "</ul>"
                      
                      resend.Emails.send({'from': 'onboarding@resend.dev', 'to': user_email, 'subject': subj, 'html': body})
                      print('✅ 邮件发送成功！')
                  except Exception as e:
                      print(f'❌ 邮件发送失败: {e}')
              else:
                  print('❌ 邮箱未配置')
          else:
              print('\n🏁 监控结束，无符合条件房源。')
          EOF
          
          python -u monitor.py
